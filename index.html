<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Form</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Main background using MTN Signature Yellow */
        body { 
            background-color: #FFCC00; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        /* Form container styling */
        .container { 
            background: #000000; 
            color: #ffffff;
            max-width: 480px; 
            width: 100%; 
            border-radius: 12px; 
            padding: 28px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
        }

        h2 { margin-top: 0; color: #FFCC00; font-size: 22px; }
        p { color: #cccccc; font-size: 14px; margin-bottom: 22px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #ffffff; margin-bottom: 6px; }
        
        input, select { 
            width: 100%; 
            padding: 11px; 
            border: 1px solid #333333; 
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 6px; 
            font-size: 14px; 
        }
        
        input:focus, select:focus { 
            outline: none; 
            border-color: #FFCC00; 
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.3);
        }

        .checkbox-group { 
            display: flex; 
            gap: 10px; 
            align-items: flex-start; 
            font-size: 12px; 
            color: #cccccc; 
        }
        
        .checkbox-group input { width: auto; margin-top: 2px; }
        
        /* Action Button styled with MTN Yellow */
        button { 
            width: 100%; 
            padding: 13px; 
            background-color: #FFCC00; 
            color: #000000; 
            border: none; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: background 0.2s;
        }
        
        button:hover { background-color: #e6b800; }
        
        .success { display: none; text-align: center; padding: 20px 0; }
        .success h3 { color: #FFCC00; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div id="formSection">
        <h2>Loan Application</h2>
        <p>Complete this quick form to request a personal loan assessment.</p>

        <form id="loanForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="+256 700 000 000">
            </div>

            <div class="form-group">
                <label for="amount">Requested Amount</label>
                <input type="number" id="amount" min="100" required placeholder="1000">
            </div>

            <div class="form-group">
                <label for="income">Monthly Income</label>
                <input type="number" id="income" min="100" required placeholder="2500">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I confirm that the details provided are accurate and authorize credit verification.</label>
            </div>

            <button type="submit" id="submitBtn">Submit Request</button>
        </form>
    </div>

    <div id="successSection" class="success">
        <h3>Application Submitted!</h3>
        <p>Your request has been received. Reference number: <strong id="refNum" style="color: #FFCC00;"></strong></p>
    </div>
</div>

<script>
    function handleSubmit(event) {
        event.preventDefault();
        document.getElementById('submitBtn').innerText = 'Submitting...';
        
        setTimeout(() => {
            const ref = 'REF-' + Math.floor(10000 + Math.random() * 90000);
            document.getElementById('refNum').innerText = ref;
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';
        }, 1000);
    }
</script>

</body>
</html>
